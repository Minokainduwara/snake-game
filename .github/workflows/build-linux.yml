name: Build Linux Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Cache raylib build
        id: cache-raylib
        uses: actions/cache@v4
        with:
          path: raylib
          key: ${{ runner.os }}-raylib-linux-6.0

      - name: Build raylib from source
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          RAYLIB_VER="6.0"
          wget -q "https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VER}.tar.gz"
          tar -xzf "${RAYLIB_VER}.tar.gz"
          
          mkdir -p raylib-build
          cd raylib-build
          cmake ../raylib-${RAYLIB_VER} \
            -DCMAKE_INSTALL_PREFIX=../raylib \
            -DBUILD_SHARED_LIBS=OFF \
            -DPLATFORM=Desktop \
            -DENABLE_OPENGL_AUTO_DETECT=ON
          
          make -j$(nproc)
          make install
          cd ..
          rm -rf raylib-${RAYLIB_VER} raylib-${RAYLIB_VER}.tar.gz raylib-build
          
          # Create pkg-config file if it wasn't installed
          if [ ! -f raylib/lib/pkgconfig/raylib.pc ]; then
            mkdir -p raylib/lib/pkgconfig
            printf '%s\n' \
              "prefix=${PWD}/raylib" \
              "exec_prefix=\${prefix}" \
              "libdir=\${exec_prefix}/lib" \
              "includedir=\${prefix}/include" \
              "" \
              "Name: raylib" \
              "Description: A simple and easy-to-use library to enjoy videogames programming" \
              "Version: 6.0" \
              "Libs: -L\${libdir} -lraylib -lGL -lm -lpthread -ldl -lrt -lX11" \
              "Cflags: -I\${includedir}" \
              > raylib/lib/pkgconfig/raylib.pc
          fi

      - name: Build snake binary
        run: |
          make clean
          PKG_CONFIG_PATH="${{ github.workspace }}/raylib/lib/pkgconfig:$PKG_CONFIG_PATH" make
          ls -la snake

      - name: Package as tar.gz
        run: |
          mkdir -p snake-game-linux
          cp snake snake-game-linux/
          cp -r saves snake-game-linux/ 2>/dev/null || mkdir -p snake-game-linux/saves
          tar -czf SnakeGame-Linux.tar.gz snake-game-linux/
          ls -la SnakeGame-Linux.tar.gz

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-Linux
          path: SnakeGame-Linux.tar.gz

      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: snake-linux-portable
          path: snake