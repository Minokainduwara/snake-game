name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  build-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make nsis cmake

      - name: Cache raylib built from source
        id: cache-raylib
        uses: actions/cache@v4
        with:
          path: raylib
          key: ${{ runner.os }}-raylib-mingw-built-6.0

      - name: Build raylib from source with MinGW
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          RAYLIB_VER="6.0"
          # Download raylib source
          wget -q "https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VER}.tar.gz"
          tar -xzf "${RAYLIB_VER}.tar.gz"
          
          # Build raylib with MinGW cross-compiler
          mkdir -p raylib-build
          cd raylib-build
          cmake ../raylib-${RAYLIB_VER} \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_INSTALL_PREFIX=../raylib \
            -DBUILD_SHARED_LIBS=OFF \
            -DPLATFORM=Desktop \
            -DENABLE_OPENGL_AUTO_DETECT=ON
          
          make -j$(nproc)
          make install
          cd ..
          rm -rf raylib-${RAYLIB_VER} raylib-${RAYLIB_VER}.tar.gz raylib-build

      - name: Cache compiled objects
        id: cache-obj
        uses: actions/cache@v4
        with:
          path: obj-windows
          key: ${{ runner.os }}-obj-${{ hashFiles('src/*.c', 'src/*.h', 'Makefile.windows') }}

      - name: Build snake.exe with MinGW
        run: |
          make -f Makefile.windows CC=x86_64-w64-mingw32-gcc
          ls -la snake.exe

      - name: Build installer with NSIS
        run: |
          cp snake.exe installer/
          cd installer && makensis -NOCD -DVERSION=1.0.0 setup.nsi
          mv SnakeGame-Setup*.exe ../
          cd ..
          ls -la SnakeGame-Setup*.exe

      - name: Upload snake.exe (portable)
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-portable
          path: snake.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-Setup
          path: SnakeGame-Setup*.exe